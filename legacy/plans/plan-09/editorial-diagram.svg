<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title"><title id="title">実家の見回りは、最後の戸締まりまでをセットに</title><rect width="900" height="420" rx="18" fill="#f7f5f0"/><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" fill="#263d42"><text x="36" y="51" font-size="25" font-weight="700">実家の見回りは、最後の戸締まりまでをセットに</text><rect x="30" y="90" width="195" height="230" rx="12" fill="white" stroke="#cddbd6"/><text x="50" y="128" font-size="22" fill="#263d42">1 外から</text><text x="50" y="170" font-size="18" fill="#263d42">玄関・窓</text><text x="50" y="201" font-size="18" fill="#263d42">郵便受け</text><text x="50" y="232" font-size="18" fill="#263d42">不審な跡</text><rect x="245" y="90" width="195" height="230" rx="12" fill="white" stroke="#cddbd6"/><text x="265" y="128" font-size="22" fill="#263d42">2 室内</text><text x="265" y="170" font-size="18" fill="#263d42">しみ・濡れ</text><text x="265" y="201" font-size="18" fill="#263d42">におい</text><text x="265" y="232" font-size="18" fill="#263d42">換気</text><rect x="460" y="90" width="195" height="230" rx="12" fill="white" stroke="#cddbd6"/><text x="480" y="128" font-size="22" fill="#263d42">3 水まわり</text><text x="480" y="170" font-size="18" fill="#263d42">漏れの有無</text><text x="480" y="201" font-size="18" fill="#263d42">蛇口・排水</text><text x="480" y="232" font-size="18" fill="#263d42">管理方法に沿う</text><rect x="675" y="90" width="195" height="230" rx="12" fill="white" stroke="#cddbd6"/><text x="695" y="128" font-size="22" fill="#263d42">4 帰る前</text><text x="695" y="170" font-size="18" fill="#263d42">窓・蛇口を閉める</text><text x="695" y="201" font-size="18" fill="#263d42">必要設備を確認</text><text x="695" y="232" font-size="18" fill="#263d42">施錠・家族へ報告</text><text x="35" y="370" font-size="20" fill="#263d42">同じ場所の写真＋「見た日・見た人・気付いたこと」を残しましょう。</text></g></svg>