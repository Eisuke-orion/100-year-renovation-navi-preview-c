<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="排水トラップの水が下水の臭いの通り道をふさぐ。水が蒸発すると臭いが上がる場合がある。"><rect width="720" height="440" rx="18" fill="#faf9f3"/><style>text{font-family:"Noto Sans JP",sans-serif;fill:#304b39}.sm{font-size:18px}.md{font-size:22px;font-weight:bold}.lg{font-size:28px;font-weight:bold}.line{fill:none;stroke:#5e7865;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><text x="30" y="44" class="md">留守の家で、排水口がにおう理由</text><path d="M145 105V235Q145 300 210 300Q275 300 275 235V105M185 105V235Q185 260 210 260Q235 260 235 235V105" fill="none" stroke="#8da298" stroke-width="15"/><path d="M164 215V235Q164 280 210 280Q255 280 255 235V215" fill="none" stroke="#78b5cb" stroke-width="22"/><text x="80" y="352" class="md">水がたまっている</text><text x="65" y="389" class="sm">下水の臭いを遮る役目</text><path d="M445 105V235Q445 300 510 300Q575 300 575 235V105M485 105V235Q485 260 510 260Q535 260 535 235V105" fill="none" stroke="#8da298" stroke-width="15"/><path d="M555 160V240Q555 280 510 280Q465 280 465 230V145" fill="none" stroke="#b57951" stroke-width="5" stroke-dasharray="9 6"/><text x="425" y="352" class="md">長期間、使わない</text><text x="405" y="389" class="sm">水が蒸発して臭いが上がる</text></svg>