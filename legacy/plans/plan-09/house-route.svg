<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="見回りは屋外、室内、水まわり、施錠の順。確認箇所を見える形にする。"><rect width="720" height="440" rx="18" fill="#faf9f3"/><style>text{font-family:"Noto Sans JP",sans-serif;fill:#304b39}.sm{font-size:18px}.md{font-size:22px;font-weight:bold}.lg{font-size:28px;font-weight:bold}.line{fill:none;stroke:#5e7865;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><text x="30" y="44" class="md">いつも同じ順番で、変化を見つける</text><path d="M90 200L355 75 630 200M125 185V355H600V185M355 100V355M125 250H600" class="line"/><text x="170" y="228" class="md">② 壁・天井</text><text x="390" y="228" class="md">③ 水まわり</text><text x="170" y="310" class="md">① 玄関・外周</text><text x="390" y="310" class="md">④ 窓・施錠</text><path d="M245 320V270M245 165H450M480 260V295" stroke="#b57951" fill="none" stroke-width="5" stroke-dasharray="9 7"/><text x="115" y="401" class="md">同じ場所を撮影 → 前回の写真と比べる</text></svg>