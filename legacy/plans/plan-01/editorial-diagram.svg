<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title"><title id="title">毎朝の結露対策は、2つの方向から</title><rect width="900" height="420" rx="18" fill="#f7f5f0"/><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" fill="#263d42"><text x="36" y="51" font-size="25" font-weight="700">毎朝の結露対策は、2つの方向から</text><rect x="35" y="90" width="400" height="230" rx="12" fill="white" stroke="#cddbd6"/><text x="55" y="128" font-size="22" fill="#263d42">室内に湿気をためない</text><text x="55" y="170" font-size="18" fill="#263d42">24時間換気と給気口を確認</text><text x="55" y="201" font-size="18" fill="#263d42">加湿器の使い方を見直す</text><text x="55" y="232" font-size="18" fill="#263d42">洗濯物の干し場所を工夫する</text><rect x="465" y="90" width="400" height="230" rx="12" fill="white" stroke="#cddbd6"/><text x="485" y="128" font-size="22" fill="#263d42">窓を冷えにくくする</text><text x="485" y="170" font-size="18" fill="#263d42">内窓などの断熱を相談</text><text x="485" y="201" font-size="18" fill="#263d42">ガラスだけでなく枠も見る</text><text x="485" y="232" font-size="18" fill="#263d42">開け閉めやカーテンも確認</text><text x="35" y="370" font-size="20" fill="#263d42">濡れた窓の写真を撮っておくと、現地調査で伝えやすくなります。</text></g></svg>