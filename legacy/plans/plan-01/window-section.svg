<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="外窓と内窓の間の空気層で外気の影響を受けにくくする仕組み。"><rect width="720" height="440" rx="18" fill="#faf9f3"/><style>text{font-family:"Noto Sans JP",sans-serif;fill:#304b39}.sm{font-size:18px}.md{font-size:22px;font-weight:bold}.lg{font-size:28px;font-weight:bold}.line{fill:none;stroke:#5e7865;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><text x="30" y="44" class="md">内窓で、窓辺の冷えを和らげる</text><rect x="40" y="80" width="185" height="270" fill="#dbeaf0"/><rect x="225" y="80" width="90" height="270" fill="#eff3ed"/><rect x="315" y="80" width="365" height="270" fill="#f8e9cf"/><path d="M225 80V350M315 80V350" stroke="#6b8678" stroke-width="12"/><text x="75" y="126" class="lg">屋外</text><text x="440" y="126" class="lg">室内</text><text x="65" y="300" class="md">冷たい外気</text><text x="415" y="300" class="md">暖かい空気</text><path d="M86 194H188M174 180L190 194 174 208" class="line"/><path d="M520 194H350M366 180L350 194 366 208" class="line"/><text x="195" y="388" class="sm">外窓</text><text x="300" y="388" class="sm">内窓</text><text x="380" y="388" class="sm">間の空気層が断熱に役立つ</text><path d="M270 200V290M265 282L270 292 275 282" class="line"/></svg>