<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="調理と入浴で出る水蒸気をその場所で換気し、部屋では加湿量を見直す。"><rect width="720" height="440" rx="18" fill="#faf9f3"/><style>text{font-family:"Noto Sans JP",sans-serif;fill:#304b39}.sm{font-size:18px}.md{font-size:22px;font-weight:bold}.lg{font-size:28px;font-weight:bold}.line{fill:none;stroke:#5e7865;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><text x="30" y="44" class="md">水分は、発生した場所で逃がす</text><path d="M55 220H195V340H55ZM87 220V185H150V220M87 275H164" class="line"/><path d="M110 165C80 140 140 130 110 105M150 165C120 140 180 130 150 105" class="line"/><text x="58" y="380" class="sm">調理中は換気扇</text><path d="M275 250H445L425 330H295ZM295 330V345M425 330V345M290 250V200Q290 173 320 180" class="line"/><path d="M330 220C300 195 360 180 330 155M380 220C350 195 410 180 380 155" class="line"/><text x="270" y="380" class="sm">浴室の湿気を排出</text><rect x="520" y="205" width="135" height="130" rx="15" fill="#e5ece1" stroke="#5e7865" stroke-width="4"/><path d="M555 190C530 165 580 155 555 130M610 190C585 165 635 155 610 130" class="line"/><text x="520" y="380" class="sm">加湿しすぎを防ぐ</text></svg>