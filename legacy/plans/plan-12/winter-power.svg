<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="同じ1000Whの容量でも使用機器の消費電力で理論上の時間は大きく変わる。"><rect width="720" height="440" rx="18" fill="#faf9f3"/><style>text{font-family:"Noto Sans JP",sans-serif;fill:#304b39}.sm{font-size:18px}.md{font-size:22px;font-weight:bold}.lg{font-size:28px;font-weight:bold}.line{fill:none;stroke:#5e7865;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><text x="30" y="44" class="md">電源の容量は、何に使うかで変わる</text><text x="30" y="90" class="md">1,000Wh ÷ 消費電力 ＝ 理論上の時間</text><text x="30" y="145" class="sm">50Wの機器</text><rect x="30" y="160" width="600" height="48" rx="5" fill="#63816a"/><text x="510" y="193" style="font-size:24px;font-weight:bold;fill:white">20時間</text><text x="30" y="250" class="sm">1,000Wの機器</text><rect x="30" y="265" width="30" height="48" rx="5" fill="#b57951"/><text x="80" y="298" class="md">1時間</text><text x="30" y="360" class="sm">0を起点とした同じ尺度（横幅600＝20時間）</text><text x="30" y="397" class="sm">説明用の計算例。変換損失や温度の影響は含みません。</text></svg>