<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">暖房が止まったら、一部屋あったか作戦</title><desc id="d">家族で集まる部屋を決め、身の回りから冷えを和らげる。給気口と避難する通路は空ける。体が暖まらなければ、暖かい場所への移動を。</desc><rect width="960" height="640" rx="24" fill="#F8F6F0"/><g font-family="sans-serif" fill="#243F3A"><text x="48" y="64" font-size="29" font-weight="700">暖房が止まったら、一部屋あったか作戦</text><text x="48" y="103" font-size="18">家族で集まる部屋を決め、身の回りから冷えを和らげる</text><rect x="48" y="130" width="864" height="116" rx="18" fill="#E9F2F0"/><circle cx="94" cy="172" r="23" fill="#38645B"/><text x="94" y="179" fill="white" text-anchor="middle" font-size="23">1</text><text x="136" y="174" font-size="24" font-weight="700">窓からの冷え</text><text x="136" y="211" font-size="20">カーテンを閉め、使わない部屋のドアも閉める</text><text x="844" y="174" text-anchor="end" font-size="18">窓</text><rect x="48" y="265" width="864" height="116" rx="18" fill="#FFF0DA"/><circle cx="94" cy="307" r="23" fill="#38645B"/><text x="94" y="314" fill="white" text-anchor="middle" font-size="23">2</text><text x="136" y="309" font-size="24" font-weight="700">床からの冷え</text><text x="136" y="346" font-size="20">ラグ・マット・座布団で、床に直接座るのを避ける</text><text x="844" y="309" text-anchor="end" font-size="18">床</text><rect x="48" y="400" width="864" height="116" rx="18" fill="#E9EDF7"/><circle cx="94" cy="442" r="23" fill="#38645B"/><text x="94" y="449" fill="white" text-anchor="middle" font-size="23">3</text><text x="136" y="444" font-size="24" font-weight="700">体の冷え</text><text x="136" y="481" font-size="20">重ね着と毛布。首元・足元も覆う</text><text x="844" y="444" text-anchor="end" font-size="18">体</text><text x="48" y="574" font-size="19">給気口と避難する通路は空ける。体が暖まらなければ、暖かい場所への移動を。</text><text x="48" y="610" font-size="15" fill="#65756E">本文の行動を整理した独自図。実測データや特定製品の性能を示すものではありません。</text></g></svg>