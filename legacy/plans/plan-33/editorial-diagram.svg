<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="追加工事は、相談から作業まで"><rect width="760" height="600" rx="28" fill="#f3f1e8"/><text x="45" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#294d3b">追加工事は、相談から作業まで</text><rect x="35" y="100" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="145" r="23" fill="#44684c"/><text x="78" y="154" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">1</text><text x="120" y="135" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">相談する</text><text x="120" y="167" font-family="sans-serif" font-size="23" fill="#494e46">場所と理由を写真でも確認</text><rect x="35" y="210" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="255" r="23" fill="#44684c"/><text x="78" y="264" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">2</text><text x="120" y="245" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">金額と日程</text><text x="120" y="277" font-family="sans-serif" font-size="23" fill="#494e46">何がいくら、いつ変わる？</text><rect x="35" y="320" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="365" r="23" fill="#44684c"/><text x="78" y="374" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">3</text><text x="120" y="355" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">合意を残す</text><text x="120" y="387" font-family="sans-serif" font-size="23" fill="#494e46">変更書類を互いに確認</text><rect x="35" y="430" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="475" r="23" fill="#44684c"/><text x="78" y="484" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">4</text><text x="120" y="465" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">作業を進める</text><text x="120" y="497" font-family="sans-serif" font-size="23" fill="#494e46">合意した内容で施工</text></svg>