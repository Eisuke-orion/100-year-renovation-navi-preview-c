<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="追加工事は、返事をする前にこの順番"><title>追加工事は、返事をする前にこの順番</title><rect width="900" height="520" fill="#f5f2e9" rx="20"/><text x="30" y="49" fill="#425e4b" font-size="29" font-family="Noto Sans CJK JP, sans-serif">追加工事は、返事をする前にこの順番</text><circle cx="115" cy="190" r="48" fill="#425e4b"/><text x="103" y="205" fill="white" font-size="37" font-family="Noto Sans CJK JP, sans-serif">1</text><text x="31" y="285" fill="#425e4b" font-size="25" font-family="Noto Sans CJK JP, sans-serif">理由を知る</text><text x="20" y="330" fill="#425e4b" font-size="21" font-family="Noto Sans CJK JP, sans-serif">写真・現場で確認</text><path d="M168 190L278 190" fill="none" stroke="#a9bba4" stroke-width="4"/><circle cx="335" cy="190" r="48" fill="#425e4b"/><text x="323" y="205" fill="white" font-size="37" font-family="Noto Sans CJK JP, sans-serif">2</text><text x="251" y="285" fill="#425e4b" font-size="25" font-family="Noto Sans CJK JP, sans-serif">費用を聞く</text><text x="240" y="330" fill="#425e4b" font-size="21" font-family="Noto Sans CJK JP, sans-serif">追加額と工期</text><path d="M388 190L498 190" fill="none" stroke="#a9bba4" stroke-width="4"/><circle cx="555" cy="190" r="48" fill="#425e4b"/><text x="543" y="205" fill="white" font-size="37" font-family="Noto Sans CJK JP, sans-serif">3</text><text x="471" y="285" fill="#425e4b" font-size="25" font-family="Noto Sans CJK JP, sans-serif">合意を残す</text><text x="460" y="330" fill="#425e4b" font-size="21" font-family="Noto Sans CJK JP, sans-serif">変更書類を保存</text><path d="M608 190L718 190" fill="none" stroke="#a9bba4" stroke-width="4"/><circle cx="775" cy="190" r="48" fill="#ba754b"/><text x="763" y="205" fill="white" font-size="37" font-family="Noto Sans CJK JP, sans-serif">4</text><text x="691" y="285" fill="#425e4b" font-size="25" font-family="Noto Sans CJK JP, sans-serif">作業へ</text><text x="680" y="330" fill="#425e4b" font-size="21" font-family="Noto Sans CJK JP, sans-serif">決めた範囲で進む</text><text x="45" y="430" fill="#425e4b" font-size="24" font-family="Noto Sans CJK JP, sans-serif">「ついでにお願い」も、金額と日程を確かめてから。</text></svg>