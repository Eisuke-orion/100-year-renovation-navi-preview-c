<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">自宅と建物全体、工事の予定を一枚に</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">自宅と建物全体、工事の予定を一枚に</text><text x="35" y="100" font-size="22" fill="#253c32" text-anchor="start">自宅の浴室交換</text><text x="35" y="245" font-size="22" fill="#253c32" text-anchor="start">マンションの配管工事</text><path d="M70 145 L690 145" stroke="#c6cfbf" stroke-width="8" fill="none"/><path d="M70 290 L690 290" stroke="#c6cfbf" stroke-width="8" fill="none"/><circle cx="280" cy="145" r="12" fill="#c38150"/><circle cx="475" cy="290" r="12" fill="#486452"/><path d="M280 170 L475 265" stroke="#c38150" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="160" y="195" font-size="23" fill="#c38150" text-anchor="start">契約前に予定を照合</text><text x="70" y="350" font-size="22" fill="#253c32" text-anchor="start">同時にできる範囲・申請・室内への立ち入りを相談</text><text x="35" y="414" font-size="17" fill="#253c32" text-anchor="start">必要な修理は先に。全体工事まで一律に待つものではありません。</text></g></svg>