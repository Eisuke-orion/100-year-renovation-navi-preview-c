<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" role="img" aria-labelledby="title"><title id="title">大事なのは「工事のあとの残高」</title><rect width="600" height="440" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, sans-serif" fill="#253c32"><text x="26" y="45" font-size="30" text-anchor="start" fill="#253c32">大事なのは「工事のあとの残高」</text><path d="M65 95 V335 H555" stroke="#a8afa4" stroke-width="2" fill="none"/><text x="25" y="92" font-size="24" text-anchor="start" fill="#253c32">残高</text><text x="510" y="372" font-size="24" text-anchor="start" fill="#253c32">時期</text><path d="M75 260 L180 185 L220 135 L250 290 L360 200 L390 150 L420 270 L540 160" fill="none" stroke="#486452" stroke-width="6"/><path d="M220 135 L250 290 M390 150 L420 270" fill="none" stroke="#c38150" stroke-width="6"/><circle cx="420" cy="270" r="8" fill="#c38150"/><text x="250" y="113" font-size="26" text-anchor="start" fill="#a95e31">工事で減る</text><text x="420" y="315" font-size="26" text-anchor="middle" fill="#a95e31">ここを見る</text><text x="26" y="414" font-size="26" text-anchor="start" fill="#253c32">積み立てる → 工事に使う → 次に備える</text></g></svg>