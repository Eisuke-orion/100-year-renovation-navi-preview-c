<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="title"><title id="title">大事なのは「工事のあとの残高」</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="470" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">大事なのは「工事のあとの残高」</text><path d="M75 345 L690 345" stroke="#a8afa4" stroke-width="2" fill="none"/><path d="M75 340 L75 100" stroke="#a8afa4" stroke-width="2" fill="none"/><text x="48" y="105" font-size="16" fill="#253c32" text-anchor="start">残高</text><text x="674" y="380" font-size="17" fill="#253c32" text-anchor="start">時期</text><path d="M85 255 L220 170 L280 130 L310 295 L455 195 L485 145 L515 270 L675 155" fill="none" stroke="#486452" stroke-width="6"/><path d="M280 130 L310 295" stroke="#c38150" stroke-width="5" fill="none" marker-end="url(#arrow)"/><path d="M485 145 L515 270" stroke="#c38150" stroke-width="5" fill="none" marker-end="url(#arrow)"/><text x="300" y="108" font-size="21" fill="#c38150" text-anchor="start">工事で減る</text><text x="510" y="310" font-size="23" fill="#c38150" text-anchor="start">ここを見る</text><circle cx="515" cy="270" r="9" fill="#c38150"/><text x="100" y="405" font-size="20" fill="#253c32" text-anchor="start">積み立てで増える → 工事で減る → 次の工事まで備える</text><text x="35" y="440" font-size="16" fill="#253c32" text-anchor="start">動きを示す模式図。実際の金額・時期・予測ではありません。</text></g></svg>