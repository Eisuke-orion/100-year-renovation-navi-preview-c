<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">修繕積立金は「工事のあと」まで見よう</title><desc id="d">資金計画を読む順番。金額を入れない概念図です。工事後の残高 ＝ いまの残高 ＋ 今後の積立等の収入 − 工事費等の支出</desc><rect width="960" height="640" rx="24" fill="#F8F6F0"/><g font-family="sans-serif" fill="#243F3A"><text x="48" y="64" font-size="29" font-weight="700">修繕積立金は「工事のあと」まで見よう</text><text x="48" y="103" font-size="18">資金計画を読む順番。金額を入れない概念図です</text><rect x="48" y="130" width="864" height="116" rx="18" fill="#E9F2F0"/><circle cx="94" cy="172" r="23" fill="#38645B"/><text x="94" y="179" fill="white" text-anchor="middle" font-size="23">1</text><text x="136" y="174" font-size="24" font-weight="700">いま、いくらある？</text><text x="136" y="211" font-size="20">最新の決算・総会資料で、管理組合全体の残高を見る</text><text x="844" y="174" text-anchor="end" font-size="18">現在</text><rect x="48" y="265" width="864" height="116" rx="18" fill="#FFF0DA"/><circle cx="94" cy="307" r="23" fill="#38645B"/><text x="94" y="314" fill="white" text-anchor="middle" font-size="23">2</text><text x="136" y="309" font-size="24" font-weight="700">これから何に、いくら使う？</text><text x="136" y="346" font-size="20">予定する工事費と、今後の積立・増額などの前提を見る</text><text x="844" y="309" text-anchor="end" font-size="18">工事まで</text><rect x="48" y="400" width="864" height="116" rx="18" fill="#E9EDF7"/><circle cx="94" cy="442" r="23" fill="#38645B"/><text x="94" y="449" fill="white" text-anchor="middle" font-size="23">3</text><text x="136" y="444" font-size="24" font-weight="700">工事のあとも足りる？</text><text x="136" y="481" font-size="20">各年の残高を追い、不足する年と対応策を確認する</text><text x="844" y="444" text-anchor="end" font-size="18">工事のあと</text><text x="48" y="574" font-size="19">工事後の残高 ＝ いまの残高 ＋ 今後の積立等の収入 − 工事費等の支出</text><text x="48" y="610" font-size="15" fill="#65756E">本文の行動を整理した独自図。実測データや特定製品の性能を示すものではありません。</text></g></svg>