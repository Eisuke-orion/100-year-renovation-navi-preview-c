<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">分厚い資料は、この３か所から</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">分厚い資料は、この３か所から</text><rect x="45" y="95" width="425" height="290" rx="4" fill="#fff" stroke="#d4dacd"/><text x="65" y="125" font-size="20" fill="#253c32" text-anchor="start">資金計画（読み方の例）</text><rect x="60" y="147" width="390" height="43" rx="4" fill="#f5ecd8" stroke="none"/><text x="75" y="175" font-size="22" fill="#253c32" text-anchor="start">工事の予定年</text><path d="M470 169 L530 169" stroke="#c38150" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="60" y="212" width="390" height="43" rx="4" fill="#f5ecd8" stroke="none"/><text x="75" y="240" font-size="22" fill="#253c32" text-anchor="start">工事後の残高</text><path d="M470 234 L530 234" stroke="#c38150" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="60" y="277" width="390" height="43" rx="4" fill="#f5ecd8" stroke="none"/><text x="75" y="305" font-size="22" fill="#253c32" text-anchor="start">自宅の負担改定</text><path d="M470 299 L530 299" stroke="#c38150" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="550" y="175" font-size="23" fill="#253c32" text-anchor="start">いつ直す？</text><text x="550" y="240" font-size="23" fill="#253c32" text-anchor="start">足りる？</text><text x="550" y="305" font-size="23" fill="#253c32" text-anchor="start">いくら払う？</text><text x="35" y="420" font-size="18" fill="#253c32" text-anchor="start">書式や項目名はマンションごとに異なります。</text></g></svg>