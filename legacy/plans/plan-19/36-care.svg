<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">手入れは「写真 → 指定方法 → 元に戻す」</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">手入れは「写真 → 指定方法 → 元に戻す」</text><circle cx="135" cy="155" r="48" fill="#e4e9dc"/><text x="135" y="170" font-size="42" fill="#486452" text-anchor="middle">1</text><text x="135" y="255" font-size="23" fill="#253c32" text-anchor="middle">型番を撮る</text><text x="135" y="296" font-size="18" fill="#253c32" text-anchor="middle">適合する部品を選ぶ</text><circle cx="380" cy="155" r="48" fill="#e4e9dc"/><text x="380" y="170" font-size="42" fill="#486452" text-anchor="middle">2</text><text x="380" y="255" font-size="23" fill="#253c32" text-anchor="middle">開ける前に撮る</text><text x="380" y="296" font-size="18" fill="#253c32" text-anchor="middle">向きと順番を残す</text><circle cx="625" cy="155" r="48" fill="#e4e9dc"/><text x="625" y="170" font-size="42" fill="#486452" text-anchor="middle">3</text><text x="625" y="255" font-size="23" fill="#253c32" text-anchor="middle">掃除して戻す</text><text x="625" y="296" font-size="18" fill="#253c32" text-anchor="middle">指定方法・乾燥・再開</text><text x="35" y="390" font-size="18" fill="#253c32" text-anchor="start">フィルターは製品ごとに、水洗い・吸引・交換が異なります。</text></g></svg>