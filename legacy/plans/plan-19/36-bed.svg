<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">寒いときは、まず「風が当たる位置」を変える</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">寒いときは、まず「風が当たる位置」を変える</text><rect x="35" y="95" width="325" height="275" rx="14" fill="#fff" stroke="none"/><text x="197" y="130" font-size="21" fill="#253c32" text-anchor="middle">冷気が枕に直撃</text><circle cx="65" cy="185" r="17" fill="#6c9baa"/><path d="M90 185 L315 185" stroke="#6c9baa" stroke-width="6" fill="none" marker-end="url(#arrow)"/><rect x="125" y="165" width="190" height="65" rx="14" fill="#c5bca9" stroke="none"/><rect x="140" y="175" width="45" height="45" rx="14" fill="#fff" stroke="none"/><circle cx="162" cy="196" r="16" fill="#dfb08b"/><text x="197" y="345" font-size="19" fill="#486452" text-anchor="middle">給気口は開けたまま</text><rect x="400" y="95" width="325" height="275" rx="14" fill="#fff" stroke="none"/><text x="562" y="130" font-size="21" fill="#253c32" text-anchor="middle">寝る位置を風の道から外す</text><circle cx="430" cy="185" r="17" fill="#6c9baa"/><path d="M455 185 L680 185" stroke="#6c9baa" stroke-width="6" fill="none" marker-end="url(#arrow)"/><rect x="490" y="260" width="190" height="65" rx="14" fill="#c5bca9" stroke="none"/><rect x="505" y="270" width="45" height="45" rx="14" fill="#fff" stroke="none"/><circle cx="527" cy="291" r="16" fill="#dfb08b"/><text x="562" y="345" font-size="19" fill="#486452" text-anchor="middle">給気口は開けたまま</text><text x="35" y="417" font-size="18" fill="#253c32" text-anchor="start">配置例。給気口の前を家具や布でふさがない。</text></g></svg>