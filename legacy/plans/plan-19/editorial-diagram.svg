<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d"><title id="t">空気の通り道を、入口からたどってみよう</title><desc id="d">壁の給気口から浴室等の換気扇へ流れる住宅の一例。冷気が体に当たるときは、座る位置や製品の風向き調整から見直す。</desc><rect width="960" height="640" rx="24" fill="#F8F6F0"/><g font-family="sans-serif" fill="#243F3A"><text x="48" y="64" font-size="29" font-weight="700">空気の通り道を、入口からたどってみよう</text><text x="48" y="103" font-size="18">壁の給気口から浴室等の換気扇へ流れる住宅の一例</text><rect x="48" y="130" width="864" height="116" rx="18" fill="#E9F2F0"/><circle cx="94" cy="172" r="23" fill="#38645B"/><text x="94" y="179" fill="white" text-anchor="middle" font-size="23">1</text><text x="136" y="174" font-size="24" font-weight="700">入口：居室の給気口</text><text x="136" y="211" font-size="20">開けて使う。フィルターと、前に置いた家具を確認</text><text x="844" y="174" text-anchor="end" font-size="18">外 → 室内</text><rect x="48" y="265" width="864" height="116" rx="18" fill="#FFF0DA"/><circle cx="94" cy="307" r="23" fill="#38645B"/><text x="94" y="314" fill="white" text-anchor="middle" font-size="23">2</text><text x="136" y="309" font-size="24" font-weight="700">通り道：居室から廊下へ</text><text x="136" y="346" font-size="20">換気経路のドア下の隙間などを後からふさがない</text><text x="844" y="309" text-anchor="end" font-size="18">部屋 → 廊下</text><rect x="48" y="400" width="864" height="116" rx="18" fill="#E9EDF7"/><circle cx="94" cy="442" r="23" fill="#38645B"/><text x="94" y="449" fill="white" text-anchor="middle" font-size="23">3</text><text x="136" y="444" font-size="24" font-weight="700">出口：浴室・トイレ等の排気口</text><text x="136" y="481" font-size="20">ほこりと運転状態を確認。掃除後は常時換気を再開</text><text x="844" y="444" text-anchor="end" font-size="18">室内 → 外</text><text x="48" y="574" font-size="19">冷気が体に当たるときは、座る位置や製品の風向き調整から見直す。</text><text x="48" y="610" font-size="15" fill="#65756E">本文の行動を整理した独自図。実測データや特定製品の性能を示すものではありません。</text></g></svg>