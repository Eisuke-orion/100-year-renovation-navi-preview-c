<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">空気は「入口・通り道・出口」で流れる</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">空気は「入口・通り道・出口」で流れる</text><rect x="65" y="100" width="630" height="270" rx="0" fill="#fff" stroke="#486452"/><path d="M480 100 L480 220" stroke="#486452" stroke-width="4" fill="none"/><path d="M480 290 L480 370" stroke="#486452" stroke-width="4" fill="none"/><rect x="90" y="125" width="200" height="110" rx="14" fill="#eef4f7" stroke="none"/><text x="190" y="160" font-size="24" fill="#253c32" text-anchor="middle">居室</text><rect x="125" y="180" width="120" height="42" rx="14" fill="#c6b79f" stroke="none"/><text x="180" y="215" font-size="17" fill="#253c32" text-anchor="middle">ソファ</text><rect x="510" y="125" width="150" height="110" rx="14" fill="#e5edef" stroke="none"/><text x="585" y="180" font-size="22" fill="#253c32" text-anchor="middle">浴室など</text><circle cx="65" cy="275" r="15" fill="#6c9baa"/><circle cx="695" cy="180" r="15" fill="#486452"/><path d="M85 275 L450 275" stroke="#6c9baa" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M455 275 L590 275" stroke="#6c9baa" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M590 275 L590 245" stroke="#6c9baa" stroke-width="7" fill="none" marker-end="url(#arrow)"/><path d="M650 180 L725 180" stroke="#486452" stroke-width="7" fill="none" marker-end="url(#arrow)"/><text x="80" y="345" font-size="22" fill="#253c32" text-anchor="start">給気口 → 部屋 → ドア下など → 排気口</text><text x="36" y="413" font-size="18" fill="#253c32" text-anchor="start">第三種換気の模式図。自宅の換気経路は説明書で確認。</text></g></svg>