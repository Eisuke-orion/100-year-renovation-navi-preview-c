<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="留守にする前に、家の中のルールを決める"><title>留守にする前に、家の中のルールを決める</title><rect width="900" height="520" fill="#f5f2e9" rx="20"/><text x="30" y="49" fill="#425e4b" font-size="29" font-family="Noto Sans CJK JP, sans-serif">留守にする前に、家の中のルールを決める</text><rect x="65" y="90" width="530" height="325" rx="10" fill="#fff" stroke="#d6dfd4" stroke-width="2"/><rect x="82" y="108" width="195" height="140" rx="10" fill="#f2cdbb" stroke="#d6dfd4" stroke-width="2"/><rect x="285" y="108" width="293" height="140" rx="10" fill="#e4eddc" stroke="#d6dfd4" stroke-width="2"/><rect x="82" y="260" width="496" height="138" rx="10" fill="#e4eddc" stroke="#d6dfd4" stroke-width="2"/><text x="105" y="160" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">工事する場所</text><text x="310" y="160" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">普段過ごす場所</text><text x="110" y="315" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">玄関から通れる経路を確保</text><path d="M180 249L180 285" fill="none" stroke="#ba754b" stroke-width="4"/><path d="M180 285L535 285" fill="none" stroke="#ba754b" stroke-width="4"/><text x="640" y="135" fill="#425e4b" font-size="25" font-family="Noto Sans CJK JP, sans-serif">先に決める</text><text x="630" y="195" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">入室する範囲</text><text x="630" y="250" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">鍵の預け先</text><text x="630" y="305" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">貴重品の保管</text><text x="630" y="360" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">当日の連絡先</text><text x="65" y="470" fill="#425e4b" font-size="22" font-family="Noto Sans CJK JP, sans-serif">子ども・ペットは作業場所と分けて過ごす。配置は例。</text></svg>