<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="工事中の一日を、こんなふうに組み立てる"><title>工事中の一日を、こんなふうに組み立てる</title><rect width="900" height="520" fill="#f5f2e9" rx="20"/><text x="30" y="49" fill="#425e4b" font-size="29" font-family="Noto Sans CJK JP, sans-serif">工事中の一日を、こんなふうに組み立てる</text><circle cx="155" cy="170" r="55" fill="white" stroke="#425e4b" stroke-width="4"/><path d="M155 170L155 133" fill="none" stroke="#425e4b" stroke-width="4"/><path d="M155 170L184 181" fill="none" stroke="#425e4b" stroke-width="4"/><text x="130" y="267" fill="#425e4b" font-size="28" font-family="Noto Sans CJK JP, sans-serif">朝</text><text x="55" y="322" fill="#425e4b" font-size="24" font-family="Noto Sans CJK JP, sans-serif">今日の作業</text><text x="35" y="365" fill="#425e4b" font-size="21" font-family="Noto Sans CJK JP, sans-serif">使えない設備を聞く</text><circle cx="450" cy="170" r="55" fill="white" stroke="#425e4b" stroke-width="4"/><path d="M450 170L450 133" fill="none" stroke="#425e4b" stroke-width="4"/><path d="M450 170L479 181" fill="none" stroke="#425e4b" stroke-width="4"/><text x="425" y="267" fill="#425e4b" font-size="28" font-family="Noto Sans CJK JP, sans-serif">日中</text><text x="350" y="322" fill="#425e4b" font-size="24" font-family="Noto Sans CJK JP, sans-serif">外出・在宅勤務</text><text x="330" y="365" fill="#425e4b" font-size="21" font-family="Noto Sans CJK JP, sans-serif">立ち会いと連絡時間</text><circle cx="745" cy="170" r="55" fill="white" stroke="#425e4b" stroke-width="4"/><path d="M745 170L745 133" fill="none" stroke="#425e4b" stroke-width="4"/><path d="M745 170L774 181" fill="none" stroke="#425e4b" stroke-width="4"/><text x="720" y="267" fill="#425e4b" font-size="28" font-family="Noto Sans CJK JP, sans-serif">夕方</text><text x="645" y="322" fill="#425e4b" font-size="24" font-family="Noto Sans CJK JP, sans-serif">今日の進み具合</text><text x="625" y="365" fill="#425e4b" font-size="21" font-family="Noto Sans CJK JP, sans-serif">明日の生活を準備</text><text x="40" y="450" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">工事の工程表に「暮らしの予定」を重ねてみよう。</text></svg>