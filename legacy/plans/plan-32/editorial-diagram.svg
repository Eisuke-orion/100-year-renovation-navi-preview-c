<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-label="外出前に、この３つ"><rect width="760" height="490" rx="28" fill="#f3f1e8"/><text x="45" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#294d3b">外出前に、この３つ</text><rect x="35" y="100" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="145" r="23" fill="#44684c"/><text x="78" y="154" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">1</text><text x="120" y="135" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">立ち会い</text><text x="120" y="167" font-family="sans-serif" font-size="23" fill="#494e46">今日、確認が必要な場面は？</text><rect x="35" y="210" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="255" r="23" fill="#44684c"/><text x="78" y="264" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">2</text><text x="120" y="245" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">鍵と施錠</text><text x="120" y="277" font-family="sans-serif" font-size="23" fill="#494e46">誰が管理して、誰が閉める？</text><rect x="35" y="320" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="365" r="23" fill="#44684c"/><text x="78" y="374" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">3</text><text x="120" y="355" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">連絡先</text><text x="120" y="387" font-family="sans-serif" font-size="23" fill="#494e46">急な相談はどこへ連絡？</text></svg>