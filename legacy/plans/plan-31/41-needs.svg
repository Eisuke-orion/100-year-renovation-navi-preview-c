<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="設備名より、暮らしの場面で伝える"><title>設備名より、暮らしの場面で伝える</title><rect width="900" height="520" fill="#f5f2e9" rx="20"/><text x="30" y="49" fill="#425e4b" font-size="29" font-family="Noto Sans CJK JP, sans-serif">設備名より、暮らしの場面で伝える</text><rect x="50" y="90" width="340" height="330" rx="10" fill="#fff" stroke="#d6dfd4" stroke-width="2"/><text x="80" y="135" fill="#425e4b" font-size="26" font-family="Noto Sans CJK JP, sans-serif">困る場面を、そのまま</text><path d="M85 190L350 190" fill="none" stroke="#ddd" stroke-width="4"/><text x="80" y="180" fill="#425e4b" font-size="24" font-family="Noto Sans CJK JP, sans-serif">料理中、すれ違えない</text><text x="80" y="240" fill="#425e4b" font-size="24" font-family="Noto Sans CJK JP, sans-serif">夕方、暗くて探し物</text><text x="80" y="300" fill="#425e4b" font-size="24" font-family="Noto Sans CJK JP, sans-serif">片付けても物が出る</text><path d="M415 255L485 255" fill="none" stroke="#ba754b" stroke-width="4"/><rect x="510" y="90" width="340" height="330" rx="10" fill="#e9efdf" stroke="#d6dfd4" stroke-width="2"/><text x="540" y="135" fill="#425e4b" font-size="26" font-family="Noto Sans CJK JP, sans-serif">相談したい暮らしへ</text><text x="540" y="200" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">2人で料理できる幅</text><text x="540" y="265" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">手元が見える灯り</text><text x="540" y="330" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">使う場所に収納</text><text x="55" y="475" fill="#425e4b" font-size="24" font-family="Noto Sans CJK JP, sans-serif">写真と「一番困ること」を一緒に持っていこう。</text></svg>