<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" role="img" aria-label="リフォームの道しるべ"><rect width="760" height="820" rx="28" fill="#f3f1e8"/><text x="45" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#294d3b">リフォームの道しるべ</text><rect x="35" y="100" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="145" r="23" fill="#44684c"/><text x="78" y="154" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">1</text><text x="120" y="135" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">相談</text><text x="120" y="167" font-family="sans-serif" font-size="23" fill="#494e46">困りごとと希望を伝える</text><rect x="35" y="210" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="255" r="23" fill="#44684c"/><text x="78" y="264" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">2</text><text x="120" y="245" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">現地調査</text><text x="120" y="277" font-family="sans-serif" font-size="23" fill="#494e46">できる方法を聞く</text><rect x="35" y="320" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="365" r="23" fill="#44684c"/><text x="78" y="374" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">3</text><text x="120" y="355" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">見積・契約</text><text x="120" y="387" font-family="sans-serif" font-size="23" fill="#494e46">範囲と約束を確かめる</text><rect x="35" y="430" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="475" r="23" fill="#44684c"/><text x="78" y="484" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">4</text><text x="120" y="465" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">着工準備</text><text x="120" y="497" font-family="sans-serif" font-size="23" fill="#494e46">家族の生活を準備する</text><rect x="35" y="540" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="585" r="23" fill="#44684c"/><text x="78" y="594" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">5</text><text x="120" y="575" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">工事</text><text x="120" y="607" font-family="sans-serif" font-size="23" fill="#494e46">予定と変更を共有する</text><rect x="35" y="650" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="695" r="23" fill="#44684c"/><text x="78" y="704" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">6</text><text x="120" y="685" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">完成</text><text x="120" y="717" font-family="sans-serif" font-size="23" fill="#494e46">一緒に確認して使い始める</text></svg>