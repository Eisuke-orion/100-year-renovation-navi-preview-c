<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">候補地では、いつもの買い物を一度してみる</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">候補地では、いつもの買い物を一度してみる</text><text x="35" y="100" font-size="23" fill="#253c32" text-anchor="start">内覧 → スーパー → 帰り道 → 家の玄関</text><path d="M90 220 L300 150" stroke="#6c9baa" stroke-width="6" fill="none" marker-end="url(#arrow)"/><path d="M300 150 L490 250" stroke="#6c9baa" stroke-width="6" fill="none" marker-end="url(#arrow)"/><path d="M490 250 L670 190" stroke="#6c9baa" stroke-width="6" fill="none" marker-end="url(#arrow)"/><circle cx="90" cy="220" r="32" fill="#e0e8d9"/><text x="90" y="227" font-size="18" fill="#253c32" text-anchor="middle">家</text><circle cx="300" cy="150" r="32" fill="#e0e8d9"/><text x="300" y="157" font-size="18" fill="#253c32" text-anchor="middle">店</text><circle cx="490" cy="250" r="32" fill="#e0e8d9"/><text x="490" y="257" font-size="18" fill="#253c32" text-anchor="middle">坂・信号</text><circle cx="670" cy="190" r="32" fill="#e0e8d9"/><text x="670" y="197" font-size="18" fill="#253c32" text-anchor="middle">帰宅</text><text x="35" y="350" font-size="26" fill="#c38150" text-anchor="start">荷物がある帰り道も歩いてみる</text><text x="35" y="395" font-size="21" fill="#253c32" text-anchor="start">地図の「徒歩○分」から、毎日の「楽になる？」へ。</text></g></svg>