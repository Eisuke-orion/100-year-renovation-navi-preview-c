<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">お金は「３段」に分けると、見落としに気づける</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">お金は「３段」に分けると、見落としに気づける</text><rect x="50" y="100" width="660" height="78" rx="14" fill="#e6ecdf" stroke="none"/><circle cx="90" cy="139" r="22" fill="#486452"/><text x="90" y="147" font-size="24" fill="#fff" text-anchor="middle">1</text><text x="130" y="133" font-size="23" fill="#253c32" text-anchor="start">始めるとき</text><text x="130" y="161" font-size="18" fill="#253c32" text-anchor="start">工事・売買諸費用・引っ越し</text><rect x="50" y="200" width="660" height="78" rx="14" fill="#eee6d5" stroke="none"/><circle cx="90" cy="239" r="22" fill="#486452"/><text x="90" y="247" font-size="24" fill="#fff" text-anchor="middle">2</text><text x="130" y="233" font-size="23" fill="#253c32" text-anchor="start">毎月・毎年</text><text x="130" y="261" font-size="18" fill="#253c32" text-anchor="start">返済・管理費・税・保険</text><rect x="50" y="300" width="660" height="78" rx="14" fill="#e0ebee" stroke="none"/><circle cx="90" cy="339" r="22" fill="#486452"/><text x="90" y="347" font-size="24" fill="#fff" text-anchor="middle">3</text><text x="130" y="333" font-size="23" fill="#253c32" text-anchor="start">この先</text><text x="130" y="361" font-size="18" fill="#253c32" text-anchor="start">設備更新・建物の修繕</text><text x="35" y="435" font-size="17" fill="#253c32" text-anchor="start">手元の資金とローン返済を区別し、同じ支出を二重に数えない。</text></g></svg>