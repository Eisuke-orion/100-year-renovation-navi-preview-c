<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">変えたいのは「間取り」？ それとも「行き先までの距離」？</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">変えたいのは「間取り」？ それとも「行き先までの距離</text><text x="34" y="74" font-size="25" fill="#253c32" text-anchor="start">」？</text><rect x="35" y="95" width="325" height="285" rx="14" fill="#fff" stroke="none"/><rect x="400" y="95" width="325" height="285" rx="14" fill="#fff" stroke="none"/><text x="197" y="135" font-size="24" fill="#253c32" text-anchor="middle">家の中の不便</text><text x="562" y="135" font-size="24" fill="#253c32" text-anchor="middle">場所の不便</text><rect x="80" y="165" width="230" height="125" rx="0" fill="#ecede3" stroke="#486452"/><path d="M190 165 L190 290" stroke="#486452" stroke-width="4" fill="none"/><path d="M190 225 L310 225" stroke="#486452" stroke-width="4" fill="none"/><text x="130" y="225" font-size="20" fill="#253c32" text-anchor="middle">寒さ</text><text x="245" y="205" font-size="20" fill="#253c32" text-anchor="middle">段差</text><text x="245" y="265" font-size="20" fill="#253c32" text-anchor="middle">収納</text><path d="M445 280 L660 180" stroke="#6c9baa" stroke-width="9" fill="none"/><circle cx="460" cy="270" r="22" fill="#486452"/><circle cx="650" cy="180" r="22" fill="#c38150"/><text x="455" y="230" font-size="18" fill="#253c32" text-anchor="start">自宅</text><text x="605" y="140" font-size="18" fill="#253c32" text-anchor="start">店・病院</text><text x="197" y="345" font-size="20" fill="#486452" text-anchor="middle">まず改修の可能性を聞く</text><text x="562" y="345" font-size="20" fill="#486452" text-anchor="middle">候補地で日常を試す</text><text x="35" y="425" font-size="18" fill="#253c32" text-anchor="start">両方が気になるなら、同じ条件で二つの案を比べましょう。</text></g></svg>