<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title"><title id="title">変えたいのは「間取り」？ それとも「行き先までの距離」？</title><rect width="600" height="480" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, sans-serif" fill="#253c32"><text x="28" y="48" font-size="32" text-anchor="start" fill="#253c32">変えたいのは「間取り」？</text><text x="28" y="90" font-size="32" text-anchor="start" fill="#253c32">それとも「行き先までの距離」？</text><rect x="24" y="120" width="552" height="130" rx="14" fill="#fff"/><rect x="24" y="270" width="552" height="130" rx="14" fill="#fff"/><text x="45" y="160" font-size="30" text-anchor="start" fill="#253c32">家の中の不便</text><text x="45" y="201" font-size="28" text-anchor="start" fill="#253c32">寒さ・段差・収納</text><text x="45" y="235" font-size="28" text-anchor="start" fill="#486452">→ まず改修の可能性を聞く</text><text x="45" y="310" font-size="30" text-anchor="start" fill="#253c32">場所の不便</text><text x="45" y="351" font-size="28" text-anchor="start" fill="#253c32">買い物・通院の距離や坂道</text><text x="45" y="385" font-size="28" text-anchor="start" fill="#486452">→ 候補地で日常を試す</text><text x="28" y="449" font-size="26" text-anchor="start" fill="#253c32">両方なら、同じ条件で二つの案を比較。</text></g></svg>