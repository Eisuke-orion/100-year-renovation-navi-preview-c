<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title"><title id="title">通帳の金額だけでは分からない「返済の中身」</title><rect width="900" height="420" rx="18" fill="#f7f5f0"/><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" fill="#263d42"><text x="36" y="51" font-size="25" font-weight="700">通帳の金額だけでは分からない「返済の中身」</text><text x="36" y="95" font-size="20" fill="#263d42">毎月の返済額は同じでも、元金と利息の内訳が変わることがあります。</text><text x="35" y="184" font-size="20" fill="#263d42">変更前</text><rect x="150" y="145" width="420" height="62" fill="#347c73" rx="3"/><rect x="570" y="145" width="140" height="62" fill="#e3b56c" rx="3"/><text x="170" y="185" font-size="22" fill="white">元金 6万円</text><text x="583" y="185" font-size="21" fill="#263d42">利息 2万円</text><text x="735" y="185" font-size="22" fill="#263d42">計8万円</text><text x="35" y="289" font-size="20" fill="#263d42">変更後</text><rect x="150" y="250" width="350" height="62" fill="#347c73" rx="3"/><rect x="500" y="250" width="210" height="62" fill="#e3b56c" rx="3"/><text x="170" y="290" font-size="22" fill="white">元金 5万円</text><text x="513" y="290" font-size="21" fill="#263d42">利息 3万円</text><text x="735" y="290" font-size="22" fill="#263d42">計8万円</text><text x="36" y="375" font-size="18" fill="#263d42">内訳を説明するための架空の例。実際の金額は返済予定表で確認します。</text></g></svg>