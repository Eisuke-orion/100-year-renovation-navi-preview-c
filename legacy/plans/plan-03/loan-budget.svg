<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-label="手元資金から生活と緊急支出の備えを残し、工事予算を考える。緊急性のある工事を先に検討。"><rect width="720" height="440" rx="18" fill="#faf9f3"/><style>text{font-family:"Noto Sans JP",sans-serif;fill:#304b39}.sm{font-size:18px}.md{font-size:22px;font-weight:bold}.lg{font-size:28px;font-weight:bold}.line{fill:none;stroke:#5e7865;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><text x="30" y="44" class="md">工事に使うお金は、暮らしとセットで</text><path d="M360 107V122M360 122H145V160M360 122H575V160" class="line"/><text x="360" y="91" text-anchor="middle" class="lg">手元の資金</text><rect x="45" y="170" width="275" height="155" rx="15" fill="#dde7d8"/><rect x="400" y="170" width="275" height="155" rx="15" fill="#f3dfb8"/><text x="75" y="214" class="lg">残しておく</text><text x="75" y="256" class="md">生活費・急な出費</text><text x="75" y="292" class="sm">教育費など予定支出</text><text x="430" y="214" class="lg">工事に使う</text><text x="430" y="256" class="md">まず必要な修繕から</text><text x="430" y="292" class="sm">時期・範囲を相談</text><text x="70" y="380" class="md">毎月のローン返済も、続けられる金額か確認</text></svg>