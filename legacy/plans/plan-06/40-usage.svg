<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">比較するなら「同じ日数」にそろえる</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">比較するなら「同じ日数」にそろえる</text><rect x="40" y="95" width="325" height="215" rx="14" fill="#fff" stroke="none"/><rect x="395" y="95" width="325" height="215" rx="14" fill="#fff" stroke="none"/><text x="200" y="140" font-size="22" fill="#253c32" text-anchor="middle">前回（計算例）</text><text x="560" y="140" font-size="22" fill="#253c32" text-anchor="middle">今回（計算例）</text><text x="200" y="205" font-size="30" fill="#253c32" text-anchor="middle">30㎥ ÷ 60日</text><text x="560" y="205" font-size="30" fill="#253c32" text-anchor="middle">33㎥ ÷ 66日</text><text x="200" y="270" font-size="34" fill="#486452" text-anchor="middle">0.5㎥／日</text><text x="560" y="270" font-size="34" fill="#486452" text-anchor="middle">0.5㎥／日</text><text x="380" y="365" font-size="26" fill="#c38150" text-anchor="middle">合計が増えても、１日当たりは同じ</text><text x="35" y="425" font-size="17" fill="#253c32" text-anchor="start">実際の請求例ではありません。自宅の使用量と日数で計算。</text></g></svg>