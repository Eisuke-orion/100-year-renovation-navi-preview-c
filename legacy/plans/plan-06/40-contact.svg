<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">修理を頼む前に、最初の連絡先を確認</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">修理を頼む前に、最初の連絡先を確認</text><rect x="25" y="100" width="225" height="245" rx="14" fill="#fff" stroke="none"/><path d="M80 180 L135 135 L190 180 V235 H80 Z" fill="#dce6d6" stroke="#486452" stroke-width="3"/><rect x="123" y="200" width="25" height="35" rx="0" fill="#fff" stroke="none"/><text x="137" y="275" font-size="19" fill="#253c32" text-anchor="middle">賃貸</text><text x="137" y="315" font-size="16" fill="#253c32" text-anchor="middle">管理会社・貸主</text><rect x="275" y="100" width="225" height="245" rx="14" fill="#fff" stroke="none"/><path d="M330 180 L385 135 L440 180 V235 H330 Z" fill="#dce6d6" stroke="#486452" stroke-width="3"/><rect x="373" y="200" width="25" height="35" rx="0" fill="#fff" stroke="none"/><text x="387" y="275" font-size="19" fill="#253c32" text-anchor="middle">分譲マンション</text><text x="387" y="315" font-size="16" fill="#253c32" text-anchor="middle">管理会社・管理組合</text><rect x="525" y="100" width="225" height="245" rx="14" fill="#fff" stroke="none"/><path d="M580 180 L635 135 L690 180 V235 H580 Z" fill="#dce6d6" stroke="#486452" stroke-width="3"/><rect x="623" y="200" width="25" height="35" rx="0" fill="#fff" stroke="none"/><text x="637" y="275" font-size="19" fill="#253c32" text-anchor="middle">戸建ての持ち家</text><text x="637" y="315" font-size="16" fill="#253c32" text-anchor="middle">水道窓口で依頼先を確認</text><text x="35" y="405" font-size="21" fill="#253c32" text-anchor="start">伝えるのは「いつから・どこで・メーターの動き」。</text></g></svg>