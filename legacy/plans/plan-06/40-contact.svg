<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 590" role="img" aria-labelledby="title"><title id="title">修理を頼む前に、最初の連絡先を確認</title><rect width="600" height="590" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, sans-serif" fill="#253c32"><text x="26" y="45" font-size="28" text-anchor="start" fill="#253c32">修理を頼む前に、最初の連絡先を確認</text><rect x="24" y="80" width="552" height="115" rx="14" fill="#fff"/><text x="45" y="123" font-size="30" text-anchor="start" fill="#253c32">賃貸</text><text x="45" y="168" font-size="28" text-anchor="start" fill="#486452">→ 管理会社・貸主へ</text><rect x="24" y="215" width="552" height="115" rx="14" fill="#fff"/><text x="45" y="258" font-size="30" text-anchor="start" fill="#253c32">分譲マンション</text><text x="45" y="303" font-size="28" text-anchor="start" fill="#486452">→ 管理会社・管理組合へ</text><rect x="24" y="350" width="552" height="115" rx="14" fill="#fff"/><text x="45" y="393" font-size="30" text-anchor="start" fill="#253c32">戸建ての持ち家</text><text x="45" y="438" font-size="28" text-anchor="start" fill="#486452">→ 水道窓口で依頼先を確認</text><text x="26" y="515" font-size="28" text-anchor="start" fill="#253c32">伝えること：いつから・どこで</text><text x="26" y="555" font-size="28" text-anchor="start" fill="#253c32">水を止めてもメーターが動くか</text></g></svg>