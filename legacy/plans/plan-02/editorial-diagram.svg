<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title"><title id="title">暖めたいのは「服を脱ぐ場所」と「浴室」</title><rect width="900" height="420" rx="18" fill="#f7f5f0"/><g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif" fill="#263d42"><text x="36" y="51" font-size="25" font-weight="700">暖めたいのは「服を脱ぐ場所」と「浴室」</text><rect x="30" y="90" width="265" height="225" rx="12" fill="white" stroke="#cddbd6"/><text x="50" y="128" font-size="22" fill="#263d42">居間</text><text x="50" y="170" font-size="18" fill="#263d42">普段過ごす暖かい場所</text><text x="50" y="201" font-size="18" fill="#263d42">移動前に脱衣所を予熱</text><rect x="318" y="90" width="265" height="225" rx="12" fill="white" stroke="#cddbd6"/><text x="338" y="128" font-size="22" fill="#263d42">脱衣所</text><text x="338" y="170" font-size="18" fill="#263d42">裸になる前に暖める</text><text x="338" y="201" font-size="18" fill="#263d42">床に物を増やしたくない</text><text x="338" y="232" font-size="18" fill="#263d42">なら壁付け暖房も候補</text><rect x="606" y="90" width="265" height="225" rx="12" fill="white" stroke="#cddbd6"/><text x="626" y="128" font-size="22" fill="#263d42">浴室</text><text x="626" y="170" font-size="18" fill="#263d42">入浴前に暖める</text><text x="626" y="201" font-size="18" fill="#263d42">衣類乾燥機能があれば</text><text x="626" y="232" font-size="18" fill="#263d42">雨の日の物干しにも</text><text x="299" y="207" font-size="28" fill="#263d42">›</text><text x="588" y="207" font-size="28" fill="#263d42">›</text><text x="34" y="365" font-size="20" fill="#263d42">居間との温度差は5℃以内を目安に。入浴前から準備しましょう。</text></g></svg>