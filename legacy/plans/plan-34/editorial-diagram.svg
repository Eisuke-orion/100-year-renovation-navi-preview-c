<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="引き渡しの４つの確認"><rect width="760" height="600" rx="28" fill="#f3f1e8"/><text x="45" y="65" font-family="sans-serif" font-size="30" font-weight="bold" fill="#294d3b">引き渡しの４つの確認</text><rect x="35" y="100" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="145" r="23" fill="#44684c"/><text x="78" y="154" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">1</text><text x="120" y="135" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">見る</text><text x="120" y="167" font-family="sans-serif" font-size="23" fill="#494e46">約束した範囲と仕上がり</text><rect x="35" y="210" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="255" r="23" fill="#44684c"/><text x="78" y="264" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">2</text><text x="120" y="245" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">動かす</text><text x="120" y="277" font-family="sans-serif" font-size="23" fill="#494e46">扉や設備を実際に使う</text><rect x="35" y="320" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="365" r="23" fill="#44684c"/><text x="78" y="374" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">3</text><text x="120" y="355" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">聞く</text><text x="120" y="387" font-family="sans-serif" font-size="23" fill="#494e46">手入れ・保証・連絡先</text><rect x="35" y="430" width="690" height="90" rx="16" fill="white"/><circle cx="78" cy="475" r="23" fill="#44684c"/><text x="78" y="484" text-anchor="middle" font-family="sans-serif" font-size="24" fill="white">4</text><text x="120" y="465" font-family="sans-serif" font-size="24" font-weight="bold" fill="#294d3b">受け取る</text><text x="120" y="497" font-family="sans-serif" font-size="23" fill="#494e46">書類と、残る対応のメモ</text></svg>