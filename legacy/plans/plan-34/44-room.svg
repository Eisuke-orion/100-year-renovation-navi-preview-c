<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="引き渡しは「いつもの動き」で確かめる"><title>引き渡しは「いつもの動き」で確かめる</title><rect width="900" height="520" fill="#f5f2e9" rx="20"/><text x="30" y="49" fill="#425e4b" font-size="29" font-family="Noto Sans CJK JP, sans-serif">引き渡しは「いつもの動き」で確かめる</text><rect x="65" y="110" width="550" height="290" rx="10" fill="#fff" stroke="#d6dfd4" stroke-width="2"/><rect x="95" y="160" width="150" height="225" rx="10" fill="#e5eadb" stroke="#d6dfd4" stroke-width="2"/><path d="M165 160L165 385" fill="none" stroke="#425e4b" stroke-width="4"/><circle cx="151" cy="270" r="5" fill="#ba754b"/><rect x="340" y="225" width="230" height="160" rx="10" fill="#e5eadb" stroke="#d6dfd4" stroke-width="2"/><ellipse cx="450" cy="236" rx="67" ry="18" fill="white" stroke="#425e4b" stroke-width="3"/><path d="M450 220v-45q0-23 29-23v20" fill="none" stroke="#425e4b" stroke-width="6"/><path d="M450 183L450 210" fill="none" stroke="#89b4c0" stroke-width="4"/><path d="M130 275L690 140" fill="none" stroke="#ba754b" stroke-width="4"/><text x="655" y="117" fill="#425e4b" font-size="25" font-family="Noto Sans CJK JP, sans-serif">開閉する</text><path d="M450 255L690 245" fill="none" stroke="#ba754b" stroke-width="4"/><text x="650" y="225" fill="#425e4b" font-size="25" font-family="Noto Sans CJK JP, sans-serif">水を流す</text><path d="M420 385L685 365" fill="none" stroke="#ba754b" stroke-width="4"/><text x="645" y="345" fill="#425e4b" font-size="25" font-family="Noto Sans CJK JP, sans-serif">足元を見る</text><text x="60" y="465" fill="#425e4b" font-size="24" font-family="Noto Sans CJK JP, sans-serif">目で見て、動かして、毎日の使い方を確かめよう。</text></svg>