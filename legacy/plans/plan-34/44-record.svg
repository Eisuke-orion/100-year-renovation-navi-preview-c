<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-label="気になるところは、写真＋予定で残す"><title>気になるところは、写真＋予定で残す</title><rect width="900" height="520" fill="#f5f2e9" rx="20"/><text x="30" y="49" fill="#425e4b" font-size="29" font-family="Noto Sans CJK JP, sans-serif">気になるところは、写真＋予定で残す</text><rect x="65" y="95" width="770" height="335" rx="10" fill="#fff" stroke="#d6dfd4" stroke-width="2"/><text x="100" y="145" fill="#425e4b" font-size="25" font-family="Noto Sans CJK JP, sans-serif">手直しの記録（記入例）</text><text x="100" y="205" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">どこ？</text><text x="290" y="205" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">キッチン右側の収納扉</text><path d="M95 220L795 220" fill="none" stroke="#ddd" stroke-width="4"/><text x="100" y="265" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">何をする？</text><text x="290" y="265" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">開閉を調整する</text><path d="M95 280L795 280" fill="none" stroke="#ddd" stroke-width="4"/><text x="100" y="325" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">いつ？</text><text x="290" y="325" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">担当者と日程を決めて記入</text><path d="M95 340L795 340" fill="none" stroke="#ddd" stroke-width="4"/><text x="100" y="385" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">誰と確認？</text><text x="290" y="385" fill="#425e4b" font-size="23" font-family="Noto Sans CJK JP, sans-serif">住まい手と担当者で再確認</text><path d="M95 400L795 400" fill="none" stroke="#ddd" stroke-width="4"/><text x="65" y="480" fill="#425e4b" font-size="24" font-family="Noto Sans CJK JP, sans-serif">「あとで直します」を、次の約束まで具体的に。</text></svg>