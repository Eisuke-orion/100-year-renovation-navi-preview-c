<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc"><title id="title">読書席の照明配置比較</title><desc id="desc">天井灯だけでは頭と手の影が落ちる場合がある。右利きの例では左側に手元灯を加え、反射も確認する。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#66816a" stroke-width="1.5"/></marker></defs><style>text{font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;fill:#293d35}.title{font-size:30px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:20px}.note{font-size:17px;fill:#52675b}.line{stroke:#66816a;stroke-width:4;fill:none}</style><rect width="1000" height="570" rx="24" fill="#f5f4ec"/><text x="48" y="58" class="title">明るさを足す場所は、天井より「手元」かも</text>
<rect x="35" y="88" width="450" height="385" rx="20" fill="#ece9df"/><rect x="515" y="88" width="450" height="385" rx="20" fill="#e0ecdf"/>
<text x="65" y="130" class="label">天井灯だけ</text><text x="545" y="130" class="label">天井灯 ＋ 手元灯</text>
<path d="M220 170 L300 170 L285 195 L235 195Z" fill="#e1b65a"/><path d="M700 170 L780 170 L765 195 L715 195Z" fill="#e1b65a"/>
<path d="M240 195 L160 335 L360 335 L280 195" fill="#f7dfa0" opacity=".6"/><path d="M720 195 L640 335 L840 335 L760 195" fill="#f7dfa0" opacity=".6"/>
<path d="M100 353 H425 M580 353 H905" class="line"/>
<rect x="234" y="320" width="100" height="30" rx="3" fill="white" stroke="#82928b"/><rect x="714" y="320" width="100" height="30" rx="3" fill="white" stroke="#82928b"/>
<circle cx="330" cy="245" r="27" fill="#719081"/><path d="M323 272 L320 311 L365 322" class="line"/><path d="M298 273 L261 342 L320 342 L348 278" fill="#66766d" opacity=".3"/>
<circle cx="810" cy="245" r="27" fill="#719081"/><path d="M803 272 L800 311 L845 322" class="line"/>
<path d="M605 348 H660 M633 348 L617 260 L672 238" class="line"/><path d="M650 238 L690 238 L684 258 L660 258Z" fill="#bc9353"/><path d="M663 259 L710 345 L811 345 L682 259" fill="#efcc72" opacity=".55"/>
<text x="75" y="406" class="small">頭や手が光を遮り、</text><text x="75" y="437" class="small">読みたい場所に影ができる</text>
<text x="550" y="406" class="small">手元に届く光を加え、</text><text x="550" y="437" class="small">影・反射を見ながら角度を調整</text>
<text x="48" y="516" class="small">右利きの例：左側から照らす位置を出発点に、実際に書いて調整。</text><text x="48" y="548" class="note">配置の模式図。周囲の灯りも保ち、光源を直接見ない位置にします。</text></svg>