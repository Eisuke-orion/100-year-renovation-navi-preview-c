<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">夜中の移動は「スイッチまでの道」から</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">夜中の移動は「スイッチまでの道」から</text><rect x="50" y="110" width="200" height="220" rx="6" fill="#fff" stroke="#486452"/><rect x="300" y="110" width="160" height="220" rx="6" fill="#fff" stroke="#486452"/><rect x="510" y="110" width="200" height="220" rx="6" fill="#fff" stroke="#486452"/><text x="150" y="150" font-size="24" fill="#253c32" text-anchor="middle">寝室</text><text x="380" y="150" font-size="24" fill="#253c32" text-anchor="middle">廊下</text><text x="610" y="150" font-size="24" fill="#253c32" text-anchor="middle">トイレ</text><circle cx="110" cy="285" r="21" fill="#f3dba0"/><circle cx="225" cy="285" r="21" fill="#f3dba0"/><circle cx="340" cy="285" r="21" fill="#f3dba0"/><circle cx="455" cy="285" r="21" fill="#f3dba0"/><circle cx="570" cy="285" r="21" fill="#f3dba0"/><circle cx="660" cy="285" r="21" fill="#f3dba0"/><path d="M150 235 L610 235" stroke="#c38150" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="35" y="390" font-size="22" fill="#253c32" text-anchor="start">歩く道がつながるように、足元灯の位置を確認。</text><text x="35" y="430" font-size="17" fill="#253c32" text-anchor="start">センサーの範囲・点灯時間・段差の見え方も試しましょう。</text></g></svg>