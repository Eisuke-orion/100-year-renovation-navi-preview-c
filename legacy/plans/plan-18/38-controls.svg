<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title"><title id="title">「調光」と「調色」は、変えられるものが違う</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#486452"/></marker></defs><rect width="760" height="460" rx="20" fill="#f7f5ee"/><g font-family="Noto Sans JP, Hiragino Kaku Gothic ProN, sans-serif"><text x="34" y="42" font-size="25" fill="#253c32" text-anchor="start">「調光」と「調色」は、変えられるものが違う</text><text x="50" y="115" font-size="23" fill="#253c32" text-anchor="start">明るさを変える＝調光</text><rect x="50" y="145" width="660" height="60" rx="14" fill="#e8e9e2" stroke="none"/><rect x="60" y="155" width="70" height="40" rx="4" fill="rgb(110,120,110)" stroke="none"/><rect x="140" y="155" width="70" height="40" rx="4" fill="rgb(128,137,122)" stroke="none"/><rect x="220" y="155" width="70" height="40" rx="4" fill="rgb(146,154,134)" stroke="none"/><rect x="300" y="155" width="70" height="40" rx="4" fill="rgb(164,171,146)" stroke="none"/><rect x="380" y="155" width="70" height="40" rx="4" fill="rgb(182,188,158)" stroke="none"/><rect x="460" y="155" width="70" height="40" rx="4" fill="rgb(200,205,170)" stroke="none"/><rect x="540" y="155" width="70" height="40" rx="4" fill="rgb(218,222,182)" stroke="none"/><rect x="620" y="155" width="70" height="40" rx="4" fill="rgb(236,239,194)" stroke="none"/><text x="50" y="245" font-size="23" fill="#253c32" text-anchor="start">光の色を変える＝調色</text><rect x="60" y="280" width="70" height="55" rx="4" fill="rgb(250,189,115)" stroke="none"/><rect x="140" y="280" width="70" height="55" rx="4" fill="rgb(247,197,133)" stroke="none"/><rect x="220" y="280" width="70" height="55" rx="4" fill="rgb(244,205,151)" stroke="none"/><rect x="300" y="280" width="70" height="55" rx="4" fill="rgb(241,213,169)" stroke="none"/><rect x="380" y="280" width="70" height="55" rx="4" fill="rgb(238,221,187)" stroke="none"/><rect x="460" y="280" width="70" height="55" rx="4" fill="rgb(235,229,205)" stroke="none"/><rect x="540" y="280" width="70" height="55" rx="4" fill="rgb(232,237,223)" stroke="none"/><rect x="620" y="280" width="70" height="55" rx="4" fill="rgb(229,245,241)" stroke="none"/><text x="60" y="370" font-size="19" fill="#253c32" text-anchor="start">暖かい色</text><text x="600" y="370" font-size="19" fill="#253c32" text-anchor="start">白い色</text><text x="35" y="425" font-size="18" fill="#253c32" text-anchor="start">色と明るさは別の調整。いつもの本・席で見え方を試す。</text></g></svg>